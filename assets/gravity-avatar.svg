<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="gravityGrad" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="60" x2="120" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Orbit Rings -->
  <ellipse cx="60" cy="60" rx="52" ry="20" transform="rotate(-25 60 60)" stroke="url(#ringGrad)" stroke-width="2.5" stroke-dasharray="6 3" opacity="0.85" filter="url(#glow)"/>
  <ellipse cx="60" cy="60" rx="52" ry="20" transform="rotate(35 60 60)" stroke="url(#ringGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>

  <!-- Core Sphere / AI Node -->
  <circle cx="60" cy="60" r="32" fill="url(#gravityGrad)" />
  <circle cx="60" cy="60" r="32" fill="black" fill-opacity="0.15" />

  <!-- Inner Compass / Career Spark -->
  <path d="M60 36L66 54L84 60L66 66L60 84L54 66L36 60L54 54Z" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="60" cy="60" r="4" fill="#0e131f" />

  <!-- Orbital Satellites / Milestones -->
  <circle cx="98" cy="42" r="4" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="22" cy="78" r="3" fill="#ec4899" />
  <circle cx="78" cy="95" r="3.5" fill="#a855f7" />
</svg>
